<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rongboy · 加载地图</title><link rel="stylesheet" href="rongboy-interface.css"><style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: #19271e; overflow: hidden; }
button { font: inherit; cursor: pointer; white-space: nowrap; }
button:focus-visible { outline: 2px solid var(--ui-gold); outline-offset: 3px; }
#view { display: block; width: 100vw; height: 100dvh; touch-action: none; outline: none; }
body.locked #view { cursor: none; }
#fightHud {
  --hud-x: clamp(16px, 2.9vw, 56px);
  --hud-y: clamp(18px, 4.4dvh, 52px);
  position: absolute; inset: 0; z-index: 4; pointer-events: none;
}
#missionHud {
  position: absolute; top: var(--hud-y); left: var(--hud-x);
  width: min(310px, 43vw); padding: 8px 12px;
  border-inline-start: 3px solid #eac17a; border-radius: 8px;
  color: #fff0cd; background: #23392de8; font: 500 clamp(13px, 1.45vw, 17px)/1.4 var(--ui-text);
}
#missionHud strong { display: block; margin-bottom: 3px; color: #f1ca83; font: 600 .9em var(--ui-title); }
body:has(#bossHud:not([hidden])) #missionHud { max-width: min(310px, 26vw); }
body.park-tour #missionHud { width:max-content; min-width:112px; padding:8px 13px; }
body.park-tour #missionHud strong, body.park-tour .ammo-readout { display:none; }
body.park-tour #missionStep { font-weight:650; }
.hearts { position: absolute; display: flex; align-items: center; gap: clamp(3px, .48vw, 10px); left: var(--hud-x); bottom: var(--hud-y); }
.heart {
  display: block; width: clamp(33px, 3.25vw, 62px); aspect-ratio: 62 / 58;
  background: var(--heart-full) center / contain no-repeat;
  filter: drop-shadow(0 3px 3px #24190bd4);
}
.heart.off { background-image: var(--heart-empty); }
.ammo-readout {
  display: flex; align-items: center; gap: clamp(8px, 1.15vw, 19px);
  position: absolute; right: var(--hud-x); bottom: var(--hud-y); color: #fff0c9;
  filter: drop-shadow(0 2px 2px #1e190ee8) drop-shadow(0 0 7px #17181080);
}
#weaponIcon { display: block; width: clamp(78px, 10.3vw, 165px); height: auto; flex: none; }
@media (max-height: 550px) {
  #weaponIcon { width: clamp(78px, 11.2vw, 112px); }
}
.ammo { display: flex; align-items: baseline; gap: clamp(4px, .68vw, 11px); font-family: var(--ui-symbol); font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
#ammoMag { font-size: clamp(34px, 3.55vw, 64px); letter-spacing: -.045em; }
#ammo.low #ammoMag { color: #ffa487; }
.ammo-reserve { color: #f7dec0; font-size: clamp(17px, 1.9vw, 34px); }
.ammo-slash { color: #dfcfaf; font-size: clamp(16px, 1.5vw, 26px); }
#reloadStatus {
  position: absolute; right: 0; bottom: calc(100% + 9px); min-width: 104px;
  color: #ffe4ad; text-align: right; font: 700 clamp(14px, 1.2vw, 18px)/1.3 var(--ui-title);
}
#reloadStatus progress { display: block; width: 100%; height: 4px; border: 0; margin-top: 4px; accent-color: #ecc77e; }
#reloadStatus progress::-webkit-progress-bar { background: #292b229c; border-radius: 4px; }
#reloadStatus progress::-webkit-progress-value { background: #ecc77e; border-radius: 4px; }
.charge {
  position: absolute; bottom: clamp(30px, 5.1dvh, 56px); left: 50%; transform: translateX(-50%); z-index: 3;
  width: clamp(115px, 19vw, 245px); text-align: center; pointer-events: none;
  color: var(--ui-cream); text-shadow: 0 1px 3px #18150b, 0 0 6px #18150b;
}
.charge label { display: block; font: 700 clamp(13px, 1.25vw, 17px)/1.35 var(--ui-title); }
.track { height: 4px; background: #171d16bd; border-radius: 4px; margin-top: 5px; overflow: hidden; }
.fill { width: 0; height: 100%; background: #f0c778; transition: width .04s linear; }
.charge.full .fill { background: #ffde94; }
#scopeOverlay { position:fixed; inset:0; z-index:2; pointer-events:none; display:grid; place-items:center; }
.scope-glass {
  position:relative; width:min(90dvh,86vw); aspect-ratio:1; border-radius:50%;
  border:7px solid #887258; outline: 2px dashed #c0a887; outline-offset:-5px;
  box-shadow: 0 0 0 100vmax #151c17e8, inset 0 0 27px #171a1499;
  color:#fff0c2; font:700 19px/1 var(--ui-symbol);
}
.scope-glass::before,.scope-glass::after { position:absolute; content:""; background:#f7dfa4d4; top:50%; left:50%; transform:translate(-50%,-50%); }
.scope-glass::before { width:65%; height:1px; }
.scope-glass::after { height:65%; width:1px; }
.scope-glass span { position:absolute; right:18%; top:22%; text-shadow:0 2px 5px #181b14; }
body.scoped #reticle { display:none; }
#toast {
  position: absolute; z-index: 4; top: 13%; left: 50%; transform: translateX(-50%);
  max-width: min(570px, 82vw); text-align: center; pointer-events: none;
  color: var(--ui-cream); font: 700 clamp(16px, 1.55vw, 23px)/1.4 var(--ui-title);
  text-shadow: 0 2px 4px #17180d, 0 0 10px #0d130a;
}
#toast:empty { display: none; }
#reticle {
  position: absolute; z-index: 3; left: 50%; top: 50%; width: 23px; height: 23px;
  color: #fff1d3; pointer-events: none; transform: translate(-50%, -50%);
  filter: drop-shadow(0 1px 2px #211706);
}
#reticle::before, #reticle::after {
  content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
}
#reticle::before { width: 100%; height: 2px; background: linear-gradient(90deg, currentColor 0 29%, transparent 29% 71%, currentColor 71%); }
#reticle::after { width: 2px; height: 100%; background: linear-gradient(currentColor 0 29%, transparent 29% 71%, currentColor 71%); }
#reticle.target { color: #f7c66c; }
#diagnostics { position: absolute; right: 14px; top: 82px; font: 10px monospace; color: #5e674e; pointer-events: none; }
#error { position: absolute; left: 12px; top: 90px; margin: 0; background: #fff0d7; color: #9d3c2e; white-space: pre-wrap; max-width: 90%; z-index: 10; font: 12px monospace; }
#statusEffect {
  position: absolute; left: clamp(16px, 2.9vw, 56px); bottom: clamp(72px, 12dvh, 135px);
  z-index: 3; pointer-events: none; color: #f7ddb8; font: 700 16px var(--ui-title);
  text-shadow: 0 1px 4px #24170d;
}
#statusEffect:empty { display: none; }
#result { text-align: center; }
#resultNote { margin: 8px 0 4px; }
.stars { font-size: 44px; letter-spacing: 8px; margin: 6px 0 2px; }
.stats { display: flex; justify-content: space-around; gap: 12px; margin: 20px 0; }
.stats b { display: block; font-size: 25px; }
.result-actions { display: flex; gap: 10px; justify-content: center; }
#hitMarker{position:absolute;left:50%;top:50%;translate:-50% -50%;font:700 34px/1 var(--ui-symbol);color:#f9e9b6;text-shadow:0 0 3px #523e25;pointer-events:none;z-index:4}#hitMarker[data-kind="heavy"]{font-size:43px;color:#ffe3ae}#hitMarker[data-kind="heavy"]:after{content:"";position:absolute;inset:-7px;border:1px solid #f7dfb0;border-radius:50%;opacity:.6}#hitMarker[data-kind="kill"]{color:#fff9df;font-size:39px}

#swapPrompt {
  position: absolute; left: 50%; bottom: 21%; transform: translateX(-50%); z-index: 4;
  display: flex; align-items: center; gap: .45em; padding: 5px 8px; white-space: nowrap;
  background: #172519d9; color: var(--ui-cream); border-radius: 4px;
  font: 700 clamp(15px,1.35vw,20px)/1.28 var(--ui-title); pointer-events: none;
}
/* 受伤：整屏边缘的玫红、挨打那一侧更亮、指向来源的一段弧、飞出来的棉絮（准则见 docs/fun-design.md 第 4 节） */
#hurtFrame,#hurtSide,#cotton{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#hurtFrame.damage{animation:ouch .85s ease-out}
@keyframes ouch{from{box-shadow:inset 0 0 26vmin 6vmin #d2364ed0}30%{box-shadow:inset 0 0 22vmin 3vmin #d2364e90}to{box-shadow:inset 0 0 0 0 #d2364e00}}
body.danger #hurtFrame{box-shadow:inset 0 0 17vmin 1vmin #d2364e4a;animation:danger 1.1s ease-in-out infinite}
body.danger #hurtFrame.damage{animation:ouch .85s ease-out}
@keyframes danger{0%,100%{box-shadow:inset 0 0 15vmin 0 #d2364e36}50%{box-shadow:inset 0 0 21vmin 3vmin #d2364e7a}}
#hurtSide{opacity:0;background:radial-gradient(ellipse 62% 72% at var(--hx,50%) var(--hy,0%),#e23c56e0 0%,#e23c5648 42%,transparent 70%)}
#hurtSide.on{animation:hurtside .95s ease-out}@keyframes hurtside{from{opacity:1}to{opacity:0}}
#hurtArc{position:absolute;left:50%;top:50%;width:48vmin;height:48vmin;margin:-24vmin 0 0 -24vmin;border-radius:50%;pointer-events:none;z-index:2;opacity:0;rotate:var(--a,0deg);background:conic-gradient(from -27deg,transparent 0deg,#ff5a6e 27deg,transparent 54deg,transparent 360deg);-webkit-mask:radial-gradient(circle,transparent 61%,#000 62.5%,#000 69%,transparent 70.5%);mask:radial-gradient(circle,transparent 61%,#000 62.5%,#000 69%,transparent 70.5%)}
#hurtArc.on{animation:hurtarc 1.35s ease-out}@keyframes hurtarc{0%{opacity:0;scale:1.14}9%{opacity:1;scale:1}70%{opacity:.9}100%{opacity:0}}
#cotton i{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffdf6,#f1e8d4 60%,#d9cdb4);box-shadow:.9vmin -.5vmin 0 -.25vmin #f8f1e0,-.8vmin .6vmin 0 -.3vmin #f3ead6,0 0 .8vmin #fffdf680;will-change:transform,opacity}
@keyframes heartpop { 25% { scale: 1.22; rotate: -7deg; } }
@keyframes heartbeat { 50% { scale: 1.12; } }
.heart.pop { animation: heartpop .42s ease-out; }
body.danger .heart.on { animation: heartbeat 1.1s ease-in-out infinite; }
.reduced-ui .heart, .reduced-ui.danger #hurtFrame { animation: none; }

body.loading > :not(#loading):not(script){visibility:hidden}
#loading{position:fixed;inset:0;z-index:100;background:#f3ecd9;display:grid;place-items:center;color:#344b3e;text-align:center;font-family:var(--ui-text)}#loading[hidden]{display:none}#loading h1{font-size:42px;letter-spacing:.13em}#loading h2{font-size:25px;letter-spacing:.12em;font-weight:400}#loading p{font-size:13px;color:#858571}#loading progress{width:min(310px,70vw);height:5px;accent-color:#7b946e;border:0}#loading .spool{width:45px;height:45px;border:2px dashed #99ab82;border-right-color:transparent;border-radius:50%;margin:27px auto;animation:loadturn 1.2s linear infinite;will-change:transform}#loadBack{display:inline-block;margin-top:24px;color:#66765b;font-size:13px}#loadBack[hidden]{display:none}@keyframes loadturn{to{transform:rotate(360deg)}}.menu-back{display:inline-block;color:#5c6b54;margin-top:15px;font-size:13px}@media(prefers-reduced-motion:reduce){#loading .spool{animation:none}}

#gardenCompare { position: absolute; right: 16px; top: 18px; z-index: 7; min-height: 30px; font-size: 15px; }
.thread-tight #reticle { filter: drop-shadow(0 0 3px #ffe2ab); color: #ffe2ab; }
#gardenReceipt { font: 700 16px var(--ui-title); color: var(--ui-gold); }

#loading{place-items:stretch;align-items:end;text-align:left;color:#fff0ca;background-color:#15211a;background-image:linear-gradient(0deg,#0f1c14f5 1%,#101b13aa 39%,transparent 75%),var(--level-scene);background-size:cover;background-position:center;padding:4.6vw 5.5vw}
#loading>div{margin:0;max-width:min(75vw,580px)}#loading h2{font-size:clamp(42px,7vw,100px);margin:0;border-left:5px solid #edb657;padding-left:18px;line-height:1.08}
#loading p{font-size:clamp(15px,2vw,26px);margin:12px 0 21px}
.loadingBrand{position:absolute;top:5vw;left:5.5vw;display:flex;flex-direction:column;text-shadow:0 2px 11px #101505}
.loadingBrand strong{font:700 clamp(37px,6vw,95px)/1 var(--ui-title)}.loadingBrand span{font:600 clamp(11px,1.4vw,20px)/1.9 var(--ui-text);letter-spacing:.21em}
#loading progress{display:block;width:min(100%,470px);height:10px;accent-color:#efbd5e;border-radius:10px;overflow:hidden}#loading progress::-webkit-progress-bar{background:#eee8c53b;border-radius:10px}#loading progress::-webkit-progress-value{background:#efb95e;border-radius:10px}
:lang(en) .loadingBrand strong{text-transform:uppercase}
:lang(en) .loadingBrand span{visibility:hidden}
#loading #loadBack{margin-top:16px;color:#fff0ca}
/* A 版战斗界面。挑战限时和首领血条只在对应的战斗显示。 */
.game-interface { font-family: var(--ui-text); }
#challenge-run {
  position: absolute; top: clamp(16px, 3.2dvh, 34px); left: clamp(16px, 2.9vw, 56px);
  z-index: 3; display: flex; flex-wrap: wrap; gap: 8px 15px; max-width: min(340px, 42vw);
  color: var(--ui-cream); font: 700 clamp(14px,1.4vw,21px)/1.35 var(--ui-title);
  text-shadow: 0 2px 4px #19160e;
}
#challenge-clock, #challenge-window { font-variant-numeric: tabular-nums; }
#challenge-window { color: #a8e9e6; }
#bossHud {
  position: absolute; top: clamp(17px, 3.4dvh, 36px); left: 50%; transform: translateX(-50%);
  width: min(380px, 39vw); z-index: 3; text-align: center; pointer-events: none;
  color: #ffe7b9; font: 700 clamp(16px, 1.65vw, 23px)/1.2 var(--ui-title); text-shadow: 0 2px 3px #1e190d;
}
.boss-track { height: 8px; margin-top: 6px; background: #26241b; border: 1px solid #bfa575; border-radius: 5px; overflow: hidden; }
#bossFill { display: block; height: 100%; background: linear-gradient(#f7cd77, #b67438); }
.game-interface #loadingStatus { color: var(--ui-cream); font: 700 clamp(17px, 2.15vw, 29px)/1.4 var(--ui-title); }
.game-interface #loading #loadBack { display: inline-flex; }

body.practice-ready::after, body.paused::after, body.result::after { content: ""; position: fixed; z-index: 5; inset: 0; pointer-events: none; }
body.practice-ready::after { background: linear-gradient(30deg, #122118ec, #1221189c 22%, transparent 53%); }
body.paused::after, body.result::after { z-index: 9; background: #101e16be; }
body.paused #gardenCompare, body.result #gardenCompare,
body.paused #reticle, body.paused #toast, body.paused #ready-actions, body.paused #swapPrompt,
body.result #reticle, body.result #toast, body.practice-ready #toast { display: none; }

#introGuide { position:fixed; top:6vh; left:50%; transform:translateX(-50%); z-index:4; max-width:76vw; width:max-content;
  padding:8px 16px; color:var(--ui-cream); background:#253e32e8; border:1px solid var(--ui-edge); border-radius:999px;
  text-align:center; font:700 clamp(13px,1.5vw,18px)/1.25 var(--ui-text); pointer-events:none; }
#ready-actions { position: fixed; z-index: 6; bottom: 7vh; left: 5.5vw; width: min(520px, 88vw); color: var(--ui-cream); }
#ready-actions h2 { margin: 0; color: #ffe1a0; font: 700 clamp(30px, 4.2vw, 62px)/1.08 var(--ui-title); text-shadow: 0 2px 6px #0b180e; }
#ready-actions p { min-block-size: 3lh; margin: .55em 0 1em; font: 700 clamp(16px, 1.75vw, 23px)/1.5 var(--ui-text); text-shadow: 0 2px 6px #0b180e; }
.ready-buttons { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
#ready-actions .ready-buttons button {
  min-block-size: 54px; padding: .55em .5em; white-space: normal;
  font: 600 clamp(16px,2vw,24px)/1.2 var(--ui-title);
}
.ready-buttons .ui-key { inline-size: 3em; padding-inline: 0; }

#pausePanel, #result {
  position: fixed; z-index: 10; top: 50%; left: 50%; right: auto; bottom: auto;
  width: min(92vw, 790px); max-height: 92dvh; overflow: auto; transform: translate(-50%, -50%);
  padding: clamp(18px, 3vw, 40px); border: 1px solid var(--ui-edge); border-radius: 22px;
  background: linear-gradient(160deg, #304a3b, #20362a); color: var(--ui-cream);
  box-shadow: 0 14px 60px #08120bbd; outline: 1px dashed #b0c19474; outline-offset: -7px;
}
#pausePanel::before, #result::before { display: none; }
#pausePanel {
  --pause-cap-width: 34px;
  --pause-cap-height: 26px;
  width: min(92vw,736px);
  padding: clamp(18px,2.8vw,32px);
}
.pause-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: clamp(18px,3vw,32px); }
#pausePanel h2 { font: 650 clamp(28px,4.1vw,44px)/1.05 var(--ui-title); margin: 0 0 .42em; }
#result h2 { font: 700 clamp(33px,5vw,66px)/1.05 var(--ui-title); margin: 0 0 .35em; }
#pauseBrief { display: grid; gap: 5px; margin-block-end: 18px; }
#pausePlace, #pauseProgress { color: var(--ui-parchment); font: 500 14px/1.35 var(--ui-text); margin: 0; }
#objective { min-block-size: 3lh; font: 500 clamp(15px,1.75vw,19px)/1.34 var(--ui-text); margin: 0; }
.pause-actions { display: grid; gap: 8px; }
#pausePanel .pause-choice {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; min-height: 42px; margin: 0; padding: .45em .78em;
  font: 600 clamp(16px,2vw,22px)/1.2 var(--ui-title); text-align: left;
}
.pause-controls { padding-inline-start: clamp(13px,2.5vw,26px); border-inline-start: 1px solid #b0c19455; }
.pause-controls h3 { margin: 0 0 8px; font: 600 clamp(16px,1.92vw,23px)/1.2 var(--ui-text); color: var(--ui-gold); }
.pause-binding-list { display: grid; margin: 0; }
.pause-input-row {
  display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center;
  min-height: 37px; gap: 8px; padding-block: 4px; border-block-end: 1px solid #dceac125;
}
.pause-input-row dt { font: 500 clamp(14px,1.66vw,18px)/1.25 var(--ui-text); }
.pause-keyset { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin: 0; }
#pausePanel .pause-keyset .ui-key, #pausePanel .pause-action-key {
  box-sizing: border-box; inline-size: var(--pause-cap-width); min-inline-size: 0; block-size: var(--pause-cap-height);
  padding: 0; border-radius: 6px; font-size: 11px; flex-shrink: 0;
}
#pausePanel .pause-action-key { order: 1; }
#resume.selected .pause-action-key, #pauseDetailsBack.selected .pause-action-key {
  color: var(--ui-cream); background: #3a5140; border-color: #597058;
  box-shadow: 0 2px 0 #986c3b,inset 0 1px 0 #edf4ca35;
}
#pauseDetailsOpen { width: 100%; margin-top: 14px; justify-content: space-between; }
#pauseDetailsOpen::before {
  order: 1; content: ''; width: 6px; height: 6px;
  border-top: 2px solid; border-right: 2px solid; transform: rotate(45deg);
}
.pause-detail-head { display: grid; grid-template-columns: minmax(0,1fr) 172px; align-items: center; gap: 10px; margin-bottom: 12px; }
#pausePanel .pause-detail-head h2 { margin: 0; font-size: clamp(24px,3.2vw,39px); }
#pauseDetailsBack { justify-content: space-between; }
#pauseBindings dt { align-content: center; min-block-size: 2lh; }
#pauseBindings { grid-template-columns: repeat(2,minmax(0,1fr)); column-gap: 24px; }
.pause-detail-footer {
  display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 10px 14px;
  margin-top: 14px;
}
#pauseLoadout { display: flex; flex-wrap: wrap; align-content: center; min-block-size: 2lh; gap: .23em .7em; margin: 0; font: 500 13px/1.4 var(--ui-text); color: var(--ui-parchment); }
#pauseLoadout span { white-space: nowrap; }
.pause-utilities { display: grid; grid-auto-flow: column; grid-auto-columns: 104px; align-items: center; gap: 8px; }
.pause-utilities .ui-return { min-height: 34px; font-size: 15px; }
#result { width: min(92vw, 530px); }
#result .eyebrow, #resultNote { color: var(--ui-parchment); font: 700 16px/1.5 var(--ui-title); }
#result .eyebrow { margin-bottom: .6em; }
#result .stars { color: var(--ui-gold); }
#challenge-stamp { margin: 14px auto 8px; color: #a14531; background: #f1dab2; font-size: clamp(43px, 7vw, 72px); animation: stamp-down .33s ease-out both; }
:lang(en) #challenge-stamp { font-size: clamp(22px, 3.6vw, 36px); }
.challenge-round #resultNote { margin: 10px 0 18px; }
@keyframes stamp-down {
  from { opacity: 0; transform: rotate(-13deg) scale(1.4); }
  68% { opacity: 1; transform: rotate(-9deg) scale(.96); }
  to { opacity: 1; transform: rotate(-9deg) scale(1); }
}
.reduced-ui #challenge-stamp { animation: none; }
#result .stats { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); padding: 12px 0; border-block: 1px dashed var(--ui-edge); }
#result .stats b { font-family: var(--ui-symbol); }
#result .stats span { display: block; min-block-size: 2lh; color: var(--ui-parchment); font: 700 14px/1.22 var(--ui-title); }
#result .result-actions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); }
#result .result-actions:has(#nextChapter:not([hidden])) { grid-template-columns: repeat(3,minmax(0,1fr)); }
#result .result-actions button { min-height: 46px; padding-inline: .45em; white-space: normal; font-size: clamp(15px,1.85vw,23px); }
#resultNote { min-block-size: 3lh; }
.game-interface .primary { padding: .55em .92em; font: 600 clamp(18px, 2vw, 26px)/1.15 var(--ui-title); }
.game-interface .panel .primary { width: auto; }
@media (max-height: 550px) {
  #pausePanel, #result { padding: 16px 20px; }
  #pausePanel h2, #result h2 { font-size: clamp(25px,6.7vh,37px); }
  #pausePanel .pause-choice { min-height: 40px; }
  .pause-input-row { min-height: 34px; }
}
@media (max-width: 630px) {
  .charge { bottom: 70px; }
