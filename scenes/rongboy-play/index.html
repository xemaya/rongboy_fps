<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rongboy · 加载地图</title><link rel="stylesheet" href="rongboy-interface.css"><style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: #19271e; overflow: hidden; }
button { font: inherit; cursor: pointer; white-space: nowrap; }
button:focus-visible { outline: 2px solid var(--ui-gold); outline-offset: 3px; }
#view { display: block; width: 100vw; height: 100dvh; touch-action: none; outline: none; }
body.locked #view { cursor: none; }
header { position: absolute; z-index: 3; top: 0; left: 0; right: 0; padding: 17px 24px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
.hud { display: flex; align-items: center; text-align: center; }
.hud .label { margin-top: 3px; }
.hearts { font-size: 24px; letter-spacing: 4px; white-space: nowrap; }
.charge { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 3; text-align: center; pointer-events: none; }
.track { border: 1px solid; border-radius: 8px; margin-top: 7px; overflow: hidden; }
.fill { width: 0; height: 100%; background: #e2ad40; transition: width .04s linear; }
.charge.full .fill { background: #de7d49; }
.charge.reloading .fill { background: #8caa9e; }
.weapon { position: absolute; z-index: 3; right: 24px; padding: 12px 15px; border: 1px solid; border-radius: 5px; pointer-events: none; }
.weapon .ammo { float: right; }
.weapon b { display: block; margin: 4px 0; }
.loadout { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.loadout .empty { opacity: .45; }
#range-hints { margin-top: 9px; }
#grenade-choice { display:inline-flex; align-items:center; gap:5px; }
#scopeOverlay { position:fixed; inset:0; z-index:2; pointer-events:none; display:grid; place-items:center; }
.scope-glass {
  position:relative; width:min(90dvh,86vw); aspect-ratio:1; border-radius:50%;
  border:7px solid #887258; outline: 2px dashed #c0a887; outline-offset:-5px;
  box-shadow: 0 0 0 100vmax #151c17e8, inset 0 0 27px #171a1499;
  color:#fff0c2; font:700 19px/1 var(--ui-symbol);
}
.scope-glass::before,.scope-glass::after { position:absolute; content:""; background:#f7dfa4d4; top:50%; left:50%; transform:translate(-50%,-50%); }
.scope-glass::before { width:65%; height:1px; }
.scope-glass::after { height:65%; width:1px; }
.scope-glass span { position:absolute; right:18%; top:22%; text-shadow:0 2px 5px #181b14; }
body.scoped #reticle { display:none; }
.loadout .slot { border: 1px solid; border-radius: 4px; }
.mission { position: absolute; z-index: 3; top: 78px; left: 24px; padding: 9px 14px; border-left: 3px solid; pointer-events: none; }
.mission b { display: block; line-height: 1.4; }
#targetLabel { position: absolute; z-index: 3; left: 50%; top: calc(50% + 24px); transform: translateX(-50%); pointer-events: none; }
#toast { position: absolute; z-index: 4; top: 19%; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
#toast:empty { display: none; }
#reticle { position: absolute; z-index: 3; left: 50%; top: 50%; width: 24px; height: 24px; border: 1px dashed #eee7ca; border-radius: 50%; box-shadow: 0 0 0 1px #66583688; pointer-events: none; transform: translate(-50%, -50%); }
#reticle::before { content: ""; position: absolute; width: 6px; height: 1px; background: #f4ebd3; left: -4px; top: 11px; }
#reticle::after { content: ""; position: absolute; width: 4px; height: 4px; background: #f3de9c; border-radius: 50%; left: 9px; top: 9px; }
#reticle.target { border: 2px solid #e0a641; width: 28px; height: 28px; }
#reticle.target::after { left: 10px; top: 10px; }
#diagnostics { position: absolute; right: 14px; top: 82px; font: 10px monospace; color: #5e674e; pointer-events: none; }
#error { position: absolute; left: 12px; top: 90px; margin: 0; background: #fff0d7; color: #9d3c2e; white-space: pre-wrap; max-width: 90%; z-index: 10; font: 12px monospace; }
#statusEffect { position: absolute; left: 24px; padding: 5px 10px; z-index: 3; pointer-events: none; }
#statusEffect:empty { display: none; }
#result { text-align: center; }
#resultNote { margin: 8px 0 4px; }
.stars { font-size: 44px; letter-spacing: 8px; margin: 6px 0 2px; }
.stats { display: flex; justify-content: space-around; gap: 12px; margin: 20px 0; }
.stats b { display: block; font-size: 25px; }
.result-actions { display: flex; gap: 10px; justify-content: center; }
@media (max-width: 720px) {
  header { padding: 12px; }
  .hearts { font-size: 19px; letter-spacing: 1px; }
  .weapon { right: 12px; padding: 8px 11px; }
  .mission { top: 62px; left: 12px; }
  .mission b { font-size: 14px; }
  #diagnostics { top: 70px; }
}
#hitMarker{position:absolute;left:50%;top:50%;translate:-50% -50%;font:bold 34px/1 Georgia,serif;color:#f9e9b6;text-shadow:0 0 3px #523e25;pointer-events:none;z-index:4}#hitMarker[data-kind="heavy"]{font-size:43px;color:#ffe3ae}#hitMarker[data-kind="heavy"]:after{content:"";position:absolute;inset:-7px;border:1px solid #f7dfb0;border-radius:50%;opacity:.6}#hitMarker[data-kind="kill"]{color:#fff9df;font-size:39px}

/* 手里两把 + 手雷 */
.loadout{align-items:center}.loadout .slot{display:flex;gap:5px;align-items:baseline;white-space:nowrap;padding:4px 7px}.loadout .slot i,.loadout .slot em{font-style:normal}.loadout .slot em{opacity:.78}
.loadout .empty{text-decoration:none}.loadout .nade{flex-basis:100%;justify-content:flex-start;border-style:dashed}
#swapPrompt{position:absolute;left:50%;top:63%;transform:translateX(-50%);z-index:4;padding:7px 14px;background:#f2e5c5e8;border:1px solid #9e9270;border-radius:8px;font:15px Georgia,'Songti SC',serif;color:#3d4a36;pointer-events:none;white-space:nowrap}
#swapPrompt[hidden],body.paused #swapPrompt{display:none}#swapPrompt b{color:#8a4a2c}#swapPrompt small{opacity:.7;font-size:12px}
/* 受伤：整屏边缘的玫红、挨打那一侧更亮、指向来源的一段弧、飞出来的棉絮（准则见 docs/fun-design.md 第 4 节） */
#hurtFrame,#hurtSide,#cotton{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
#hurtFrame.damage{animation:ouch .85s ease-out}
@keyframes ouch{from{box-shadow:inset 0 0 26vmin 6vmin #d2364ed0}30%{box-shadow:inset 0 0 22vmin 3vmin #d2364e90}to{box-shadow:inset 0 0 0 0 #d2364e00}}
body.danger #hurtFrame{box-shadow:inset 0 0 17vmin 1vmin #d2364e4a;animation:danger 1.1s ease-in-out infinite}
body.danger #hurtFrame.damage{animation:ouch .85s ease-out}
@keyframes danger{0%,100%{box-shadow:inset 0 0 15vmin 0 #d2364e36}50%{box-shadow:inset 0 0 21vmin 3vmin #d2364e7a}}
#hurtSide{opacity:0;background:radial-gradient(ellipse 62% 72% at var(--hx,50%) var(--hy,0%),#e23c56e0 0%,#e23c5648 42%,transparent 70%)}
#hurtSide.on{animation:hurtside .95s ease-out}@keyframes hurtside{from{opacity:1}to{opacity:0}}
#hurtArc{position:absolute;left:50%;top:50%;width:48vmin;height:48vmin;margin:-24vmin 0 0 -24vmin;border-radius:50%;pointer-events:none;z-index:2;opacity:0;rotate:var(--a,0deg);background:conic-gradient(from -27deg,transparent 0deg,#ff5a6e 27deg,transparent 54deg,transparent 360deg);-webkit-mask:radial-gradient(circle,transparent 61%,#000 62.5%,#000 69%,transparent 70.5%);mask:radial-gradient(circle,transparent 61%,#000 62.5%,#000 69%,transparent 70.5%)}
#hurtArc.on{animation:hurtarc 1.35s ease-out}@keyframes hurtarc{0%{opacity:0;scale:1.14}9%{opacity:1;scale:1}70%{opacity:.9}100%{opacity:0}}
#cotton i{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffdf6,#f1e8d4 60%,#d9cdb4);box-shadow:.9vmin -.5vmin 0 -.25vmin #f8f1e0,-.8vmin .6vmin 0 -.3vmin #f3ead6,0 0 .8vmin #fffdf680;will-change:transform,opacity}
.hearts i{font-style:normal;display:inline-block}.hearts i.off{color:#b6a688}
.hearts i.pop{animation:heartpop .75s ease-out}@keyframes heartpop{0%{scale:1;color:#d2364e}22%{scale:2;rotate:-16deg;color:#d2364e}50%{scale:1.3;rotate:11deg;color:#d2364e}100%{scale:1;rotate:0deg}}
body.danger .hearts i.on{color:#d2364e;animation:heartbeat 1.1s ease-in-out infinite}@keyframes heartbeat{0%,100%{scale:1}50%{scale:1.28}}
@media(prefers-reduced-motion:reduce){body.danger #hurtFrame,body.danger .hearts i.on{animation:none}}

body.loading > :not(#loading):not(script){visibility:hidden}
#loading{position:fixed;inset:0;z-index:100;background:#f3ecd9;display:grid;place-items:center;color:#344b3e;text-align:center;font-family:Georgia,'Songti SC',serif}#loading[hidden]{display:none}#loading h1{font-size:42px;letter-spacing:.13em}#loading h2{font-size:25px;letter-spacing:.12em;font-weight:400}#loading p{font-size:13px;color:#858571}#loading progress{width:min(310px,70vw);height:5px;accent-color:#7b946e;border:0}#loading .spool{width:45px;height:45px;border:2px dashed #99ab82;border-right-color:transparent;border-radius:50%;margin:27px auto;animation:loadturn 1.2s linear infinite;will-change:transform}#loadBack{display:inline-block;margin-top:24px;color:#66765b;font-size:13px}#loadBack[hidden]{display:none}@keyframes loadturn{to{transform:rotate(360deg)}}.menu-back{display:inline-block;color:#5c6b54;margin-top:15px;font-size:13px}@media(prefers-reduced-motion:reduce){#loading .spool{animation:none}}

#reloadStatus{position:absolute;z-index:5;top:calc(50% + 27px);left:50%;transform:translateX(-50%);min-width:124px;padding:6px 10px;border-radius:6px;background:#294139ed;color:#fff3cc;pointer-events:none;font:600 13px/1.3 system-ui,sans-serif;text-align:center;font-variant-numeric:tabular-nums}
#reloadStatus progress{display:block;margin:5px auto 0;width:100%;height:5px;accent-color:#f1c775}
#reloadStatus[hidden],#reloadStatus progress[hidden]{display:none}
.weapon #weaponTag.zap-tip{font:12px/1.45 system-ui,sans-serif;letter-spacing:0}
#aimAdvice{position:absolute;z-index:3;left:50%;top:calc(50% + 44px);transform:translateX(-50%);padding:4px 9px;background:#26392fea;color:#fff1cd;border-radius:5px;font:12px/1.4 system-ui,sans-serif;max-width:85vw;width:max-content;text-align:center;pointer-events:none}
#aimAdvice:empty,#reloadStatus:not([hidden])~#aimAdvice,#reloadStatus:not([hidden])~#targetLabel,body.paused #aimAdvice,body.result #aimAdvice{display:none}
#gardenCompare{position:absolute;right:16px;top:98px;z-index:7;min-height:30px;font-size:15px}.single-loadout #slotB,.single-loadout #slotG,.single-loadout #keySwitch{display:none}.thread-tight #reticle{border:2px solid #ffd98b;box-shadow:0 0 0 3px #6f4a2877}#gardenReceipt{font:700 16px var(--ui-title);color:var(--ui-gold)}

#loading{place-items:stretch;align-items:end;text-align:left;color:#fff0ca;background-color:#15211a;background-image:linear-gradient(0deg,#0f1c14f5 1%,#101b13aa 39%,transparent 75%),var(--level-scene);background-size:cover;background-position:center;padding:4.6vw 5.5vw}
#loading>div{margin:0;max-width:min(75vw,580px)}#loading h2{font-size:clamp(42px,7vw,100px);margin:0;border-left:5px solid #edb657;padding-left:18px;line-height:1.08}
#loading p{font-size:clamp(15px,2vw,26px);margin:12px 0 21px}
.loadingBrand{position:absolute;top:5vw;left:5.5vw;display:flex;flex-direction:column;text-shadow:0 2px 11px #101505}
.loadingBrand strong{font:900 clamp(37px,6vw,95px)/1 "Kaiti SC",STKaiti,serif}.loadingBrand span{font:700 clamp(10px,1.4vw,20px)/2 Georgia,serif;letter-spacing:.27em}
#loading progress{display:block;width:min(100%,470px);height:10px;accent-color:#efbd5e;border-radius:10px;overflow:hidden}#loading progress::-webkit-progress-bar{background:#eee8c53b;border-radius:10px}#loading progress::-webkit-progress-value{background:#efb95e;border-radius:10px}
#loading #loadBack{margin-top:16px;color:#fff0ca}
/* 战斗信息沿屏幕边缘排，准星附近只留即时反馈。 */
.game-interface { font-family: var(--ui-text); }
.game-interface header { align-items: start; background: linear-gradient(#152219e6, #15221900); color: var(--ui-cream); text-shadow: 0 2px 6px #0d1810; }
.game-interface .sub, .game-interface .label { color: var(--ui-parchment); font: 700 clamp(12px, 1.18vw, 16px)/1.15 var(--ui-title); letter-spacing: .05em; }
.game-interface .map-room { font: 700 clamp(22px, 3vw, 40px)/1 var(--ui-title); margin: 0 0 6px; }
.game-interface .hud { gap: clamp(13px, 2.1vw, 34px); justify-content: flex-end; }
.game-interface .hud .value { font: 700 clamp(18px, 2vw, 30px)/1 var(--ui-symbol); letter-spacing: -.04em; }
.game-interface .hearts { color: #f89b85; line-height: 1; }
.game-interface .mission { max-width: min(440px, 84vw); background: linear-gradient(95deg, #17271ef2, #17271ebd); border-color: var(--ui-gold); border-radius: 0 5px 5px 0; color: var(--ui-cream); box-shadow: 0 2px 12px #0c130e40; }
.game-interface .mission small { font: 700 13px var(--ui-title); color: var(--ui-gold); }
.game-interface .mission b { margin-top: 1px; }
.challenge-round #elapsed { display: none; }
#challenge-run { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 6px; color: var(--ui-gold); font: 700 clamp(14px, 1.25vw, 18px)/1.3 var(--ui-title); }
#challenge-clock, #challenge-window { font-variant-numeric: tabular-nums; }
#challenge-window { color: #a8e9e6; }
.game-interface .weapon { bottom: 26px; width: min(260px, 41vw); background: linear-gradient(155deg, #233428f2, #152219ee); border-color: var(--ui-edge); color: var(--ui-cream); box-shadow: 0 5px 18px #0c190e68; }
.game-interface .weapon .ammo { font: 700 clamp(19px, 2.1vw, 32px)/1 var(--ui-symbol); color: #ffdea0; letter-spacing: -.08em; }
.game-interface .weapon .ammo.low { color: #ffa184; }
.game-interface .weapon b { font: 700 clamp(18px, 1.9vw, 27px)/1.05 var(--ui-title); }
.game-interface .weapon small, .game-interface .weapon #weaponTag.zap-tip, .game-interface .loadout .slot { color: var(--ui-parchment); font: 700 13px/1.35 var(--ui-title); letter-spacing: 0; }
.game-interface .loadout .slot { border-color: var(--ui-edge); }
.game-interface .loadout .selected { background: #385441; color: var(--ui-cream); border-color: #bcab78; }
.game-interface .loadout em { font-family: var(--ui-symbol); }
.game-interface .charge { width: clamp(180px, 28vw, 300px); color: var(--ui-cream); text-shadow: 0 2px 6px #0c140b, 0 0 6px #0c140b; }
.game-interface .charge label { display: inline-flex; align-items: center; justify-content: center; gap: .45em; font: 700 clamp(13px, 1.32vw, 18px)/1.4 var(--ui-title); }
.game-interface .charge.full label { color: #ffe2a6; }
.game-interface .charge .track { height: 7px; background: #13231bd9; border-color: var(--ui-edge); }
.game-interface #reloadStatus, .game-interface #aimAdvice, .game-interface #targetLabel, .game-interface #statusEffect, .game-interface #toast, .game-interface #swapPrompt {
  color: var(--ui-cream); background: #19291fea; border: 1px solid var(--ui-edge); border-radius: 4px;
  font: 700 clamp(14px, 1.35vw, 19px)/1.3 var(--ui-title); text-shadow: none;
}
.game-interface #targetLabel { padding: 2px 6px; }
.game-interface #targetLabel:empty { display: none; }
.game-interface #swapPrompt b { color: var(--ui-gold); }
.game-interface #swapPrompt small { color: var(--ui-parchment); }
.game-interface #toast { padding: 6px 14px; }
.game-interface #statusEffect { top: 144px; border-color: #d8a2a5; }
.game-interface #pause { position: fixed; z-index: 4; bottom: 24px; left: 24px; }
.game-interface #loadingStatus { color: var(--ui-cream); font: 700 clamp(17px, 2.15vw, 29px)/1.4 var(--ui-title); }
.game-interface #loading #loadBack { display: inline-flex; }

body.practice-ready::after, body.paused::after, body.result::after { content: ""; position: fixed; z-index: 5; inset: 0; pointer-events: none; }
body.practice-ready::after { background: linear-gradient(30deg, #122118ec, #1221189c 22%, transparent 53%); }
body.paused::after, body.result::after { z-index: 9; background: #101e16be; }
body.paused #gardenCompare, body.result #gardenCompare,
body.paused #reticle, body.paused #targetLabel, body.paused #toast, body.paused #ready-actions,
body.result #reticle, body.result #targetLabel, body.result #toast, body.result #pause,
body.practice-ready .mission, body.practice-ready .charge, body.practice-ready #targetLabel, body.practice-ready #pause,
body.practice-ready #toast { display: none; }

#ready-actions { position: fixed; z-index: 6; bottom: 7vh; left: 5.5vw; width: min(460px, 88vw); color: var(--ui-cream); }
#ready-actions h2 { margin: 0; color: #ffe1a0; font: 700 clamp(30px, 4.2vw, 62px)/1.08 var(--ui-title); text-shadow: 0 2px 6px #0b180e; }
#ready-actions p { margin: .55em 0 1em; font: 700 clamp(16px, 1.75vw, 23px)/1.5 var(--ui-text); text-shadow: 0 2px 6px #0b180e; }
.ready-buttons { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

#pausePanel, #result {
  position: fixed; z-index: 10; top: 50%; left: 50%; right: auto; bottom: auto;
  width: min(92vw, 790px); max-height: 92dvh; overflow: auto; transform: translate(-50%, -50%);
  padding: clamp(18px, 3vw, 40px); border: 1px solid var(--ui-edge); border-radius: 8px;
  background: linear-gradient(160deg, #243729, #15251c); color: var(--ui-cream);
  box-shadow: 0 14px 60px #08120bbd; outline: 1px dashed #c9aa724d; outline-offset: -7px;
}
#pausePanel::before, #result::before { display: none; }
.pause-grid { display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); gap: clamp(18px, 3vw, 40px); }
#pausePanel h2, #result h2 { font: 700 clamp(33px, 5vw, 66px)/1.05 var(--ui-title); margin: 0 0 .35em; }
#pausePanel .pause-choice { display: block; width: 100%; margin: 9px 0; padding: .6em .85em; color: var(--ui-cream); background: #14241acc; border: 1px solid var(--ui-edge); font: 700 clamp(18px, 2.1vw, 27px)/1.2 var(--ui-title); text-align: left; }
#pausePanel .pause-choice.selected, #pausePanel .pause-choice:hover { color: #27311d; background: #eabb64; border-color: #eabb64; }
.pause-controls { padding-inline-start: clamp(12px, 2vw, 24px); border-inline-start: 1px dashed var(--ui-edge); align-self: center; }
.pause-controls h3 { margin: 0 0 10px; font: 700 clamp(17px, 2vw, 26px) var(--ui-title); color: var(--ui-gold); }
#pauseBindings { display: grid; gap: .5em; }
.pause-utilities { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
.pause-utilities .ui-return { min-height: 34px; font-size: 16px; }
.pause-utilities .ui-return.selected { background: #eabb64; border-color: #eabb64; color: #27311d; }
#pauseTip { margin-top: 15px; }
#result { width: min(92vw, 490px); }
#result .eyebrow, #resultNote { color: var(--ui-parchment); font: 700 16px/1.5 var(--ui-title); }
#result .eyebrow { margin-bottom: .6em; }
#result .stars { color: var(--ui-gold); }
#challenge-stamp { margin: 14px auto 8px; color: #a14531; background: #f1dab2; font-size: clamp(43px, 7vw, 72px); animation: stamp-down .33s ease-out both; }
.challenge-round #resultNote { margin: 10px 0 18px; }
@keyframes stamp-down {
  from { opacity: 0; transform: rotate(-13deg) scale(1.4); }
  68% { opacity: 1; transform: rotate(-9deg) scale(.96); }
  to { opacity: 1; transform: rotate(-9deg) scale(1); }
}
.reduced-ui #challenge-stamp { animation: none; }
#result .stats { padding: 12px 0; border-block: 1px dashed var(--ui-edge); }
#result .stats b { font-family: var(--ui-symbol); }
#result .stats span { color: var(--ui-parchment); font: 700 14px var(--ui-title); }
#result .result-actions { flex-wrap: wrap; }
.game-interface .primary { color: #19241a; background: linear-gradient(160deg, #ffe1a1, #e3b664); border: 1px solid #ffd58a; border-radius: 4px; padding: .55em .9em; box-shadow: 0 3px 0 #946e35; font: 700 clamp(18px, 2vw, 27px)/1.15 var(--ui-title); }
.game-interface .primary:hover { background: #ffe2a4; }
.game-interface .panel .primary { width: auto; }
@media (max-width: 900px) {
  .game-interface .charge { left: 24px; bottom: 80px; transform: none; }
}
@media (max-width: 720px) {
  .game-interface #pause { bottom: 17px; left: 12px; }
  .game-interface .weapon { bottom: 17px; }
  .game-interface .charge { left: 12px; bottom: 70px; }
  .game-interface #statusEffect { top: 121px; left: 12px; }
}
@media (max-width: 500px) {
  .game-interface .weapon .ammo { float: none; display: block; }
  .pause-grid { grid-template-columns: 1fr; gap: 13px; }
  .pause-controls { border-inline: 0; border-top: 1px dashed var(--ui-edge); padding: 12px 0 0; }
